name: Build latest HyperBricks tag

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional HyperBricks branch or commit to test; empty builds latest tag on main'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish a complete release to an existing product tag (requires RELEASE_TOKEN)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  select:
    name: Select HyperBricks source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify generated installers
        run: python scripts/build-installers.py --check
      - name: Test tag selection and required-test checks
        run: python -m unittest discover -s tests -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperbricks/hyperbricks
          ref: ${{ inputs.source_ref || 'main' }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Resolve one immutable source commit for every runner
        id: release
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          bash scripts/resolve-source.sh source >> "$GITHUB_OUTPUT"
          printf '## Source selection\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and test ${{ matrix.os }}/${{ matrix.arch }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.select.outputs.tag }}
      SOURCE_VERSION: ${{ needs.select.outputs.version }}
      SOURCE_SHA: ${{ needs.select.outputs.sha }}
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      BINARY: out/hyperbricks${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperbricks/hyperbricks
          ref: ${{ needs.select.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify native runner and source identity
        run: |
          test "$(go env GOHOSTOS)" = "$GOOS"
          test "$(go env GOHOSTARCH)" = "$GOARCH"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/assets/version.md)" = "$SOURCE_VERSION"
      - name: Build native executable
        working-directory: source
        run: |
          go mod download
          go mod verify
          go build -mod=readonly -trimpath -buildvcs=true -o "../$BINARY" ./cmd/hyperbricks
      - name: Run the executable and check its version
        run: |
          "$BINARY" version > version.txt
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['SOURCE_VERSION'] in Path('version.txt').read_text().splitlines(), 'Wrong binary version'
          PY
      - name: Run process lifecycle, Windows process-tree and cache tests
        working-directory: source
        run: |
          set -o pipefail
          repetitions=1
          if [[ "$GOOS" == windows ]]; then repetitions=5; fi
          go test -json ./cmd/hyperbricks -run '^(TestRuntimeProcess|TestWindowsRuntime|TestResponseCache)' -count="$repetitions" -timeout=600s | tee ../test-results.jsonl
      - name: Require successful execution of the critical tests
        if: ${{ !cancelled() && hashFiles('test-results.jsonl') != '' }}
        run: python scripts/check-test-results.py test-results.jsonl "$GOOS"
      - name: Test Windows installer with native executable
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          try { ./tests/test-windows-installer.ps1 -Binary $env:BINARY -Tag $env:SOURCE_VERSION }
          catch {
            $detail = ($_ | Out-String) + $_.ScriptStackTrace
            Write-Output ("::error::" + $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            exit 1
          }
      - name: Package verified binary and checksums
        if: ${{ needs.select.outputs.mode == 'release' }}
        run: python scripts/package-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ needs.select.outputs.mode == 'release' }}
        with:
          name: hyperbricks-${{ needs.select.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep test output, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.arch }}
          path: test-results.jsonl
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish complete verified release
    needs: [select, build, installers]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && needs.select.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-${{ needs.select.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hyperbricks-${{ needs.select.outputs.tag }}-*
          merge-multiple: true
          path: release-assets
      - name: Publish only after every native job succeeds
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          SOURCE_SHA: ${{ needs.select.outputs.sha }}
        run: python scripts/publish-release.py

  installers:
    name: Installer tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify installer generation
        run: python scripts/build-installers.py --check
      - name: Test Unix installer and source selection
        if: ${{ runner.os != 'Windows' }}
        run: python -m unittest discover -s tests -v
      - name: Test publication contracts on Windows
        if: ${{ runner.os == 'Windows' }}
        run: python -m unittest discover -s tests -p test_publication.py -v
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: ${{ runner.os == 'Windows' }}
        with:
          go-version: '1.26.1'
          cache: false
      - name: Test Windows installer with executable fixture
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          go build -o fixture.exe tests/fixtures/version.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try { ./tests/test-windows-installer.ps1 -Binary ./fixture.exe -Tag v0.0.0-test }
          catch {
            $detail = ($_ | Out-String) + $_.ScriptStackTrace
            Write-Output ("::error::" + $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            exit 1
          }
