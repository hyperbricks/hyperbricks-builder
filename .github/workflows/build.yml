name: Build latest HyperBricks tag

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    name: Select latest tag on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test tag selection and required-test checks
        run: python -m unittest discover -s tests -v
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperbricks/hyperbricks
          ref: main
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Resolve one immutable source commit for every runner
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag=$(bash scripts/latest-tag.sh source)
          sha=$(git -C source rev-parse "refs/tags/${tag}^{commit}")
          test "$(git -C source show "${sha}:assets/version.md" | tr -d '\r\n')" = "$tag"
          printf 'tag=%s\nsha=%s\n' "$tag" "$sha" >> "$GITHUB_OUTPUT"
          printf '## Source\nTag: `%s`\n\nCommit: `%s`\n' "$tag" "$sha" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and test ${{ matrix.os }}/${{ matrix.arch }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.select.outputs.tag }}
      SOURCE_SHA: ${{ needs.select.outputs.sha }}
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      BINARY: out/hyperbricks${{ matrix.os == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperbricks/hyperbricks
          ref: ${{ needs.select.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify native runner and source identity
        run: |
          test "$(go env GOHOSTOS)" = "$GOOS"
          test "$(go env GOHOSTARCH)" = "$GOARCH"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/assets/version.md)" = "$RELEASE_TAG"
      - name: Build native executable
        working-directory: source
        run: |
          go mod download
          go mod verify
          go build -mod=readonly -trimpath -buildvcs=true -o "../$BINARY" ./cmd/hyperbricks
      - name: Run the executable and check its version
        run: |
          "$BINARY" version > version.txt
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ['RELEASE_TAG'] in Path('version.txt').read_text().splitlines(), 'Wrong binary version'
          PY
      - name: Run process lifecycle, Windows process-tree and cache tests
        working-directory: source
        run: |
          set -o pipefail
          go test -json ./cmd/hyperbricks -run '^(TestRuntimeProcess|TestWindowsRuntime|TestResponseCache)' -count=1 -timeout=180s | tee ../test-results.jsonl
      - name: Require successful execution of the critical tests
        if: ${{ !cancelled() && hashFiles('test-results.jsonl') != '' }}
        run: python scripts/check-test-results.py test-results.jsonl "$GOOS"
      - name: Package verified binary and checksums
        run: python scripts/package-build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hyperbricks-${{ needs.select.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Keep test output, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.arch }}
          path: test-results.jsonl
          if-no-files-found: ignore
          retention-days: 14
