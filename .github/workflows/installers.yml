name: Test installers

on:
  push:
    branches: [main]
    paths:
      - installers/**
      - scripts/build-installers.py
      - tests/test_installers.py
      - tests/test-windows-installer.ps1
      - .github/workflows/installers.yml
      - .gitattributes
  pull_request:
    paths:
      - installers/**
      - scripts/build-installers.py
      - tests/test_installers.py
      - tests/test-windows-installer.ps1
      - .github/workflows/installers.yml
      - .gitattributes
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    name: Installer ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify installer bytes and hashes
        run: python scripts/build-installers.py --check
      - name: Test Unix installer contracts
        if: ${{ runner.os != 'Windows' }}
        run: python -m unittest discover -s tests -p test_installers.py -v
      # Known source commit whose Windows process/cache suite passed five times.
      # The installer test does not select, create or publish product releases.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hyperbricks/hyperbricks
          ref: 2c7b1b64ea9d271ffa00cfde07cedaa67cad262c
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Build native installation fixture
        working-directory: source
        run: |
          go mod verify
          go build -mod=readonly -trimpath -o ../fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/hyperbricks
      - name: Install real HyperBricks on Unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          export HB_TEST_BINARY="$PWD/fixture"
          export HB_TEST_VERSION="$(tr -d '\r\n' < source/assets/version.md)"
          python -m unittest discover -s tests -p test_installers.py -v
      - name: Install and upgrade real HyperBricks on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          try {
            $version = (Get-Content source/assets/version.md -Raw).Trim()
            ./tests/test-windows-installer.ps1 -Binary ./fixture.exe -Tag $version
          } catch {
            $detail = ($_ | Out-String) + $_.ScriptStackTrace
            Write-Output ("::error::" + $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            exit 1
          }
